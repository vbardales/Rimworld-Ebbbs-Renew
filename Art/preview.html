<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Ebbbs Renew Preview</title>
<style>
* { box-sizing:border-box; }
html,body { margin:0; padding:0; width:896px; height:504px; overflow:hidden; font-family:"Segoe UI",system-ui,sans-serif; }
.scene { position:absolute; inset:0; background:url('Preview.png') center / cover; }
.veil { position:absolute; inset:0; background:radial-gradient(ellipse 900px 680px at top left, rgb(var(--veil-rgb) / .96) 0%, rgb(var(--veil-rgb) / .94) 48%, rgb(var(--veil-rgb) / 0) 100%); }
.text { position:absolute; left:50px; top:54px; color:var(--inkPrimary); text-shadow:0 3px 10px rgb(0 0 0 / .75); }
h1,p { margin:0; }
h1 { font-size:46px; font-weight:600; line-height:1.1; letter-spacing:0; }
.suffix { font-size:.65em; color:var(--inkSecondary); }
.tag { margin-top:8px; font-size:24px; font-weight:400; line-height:1.1; letter-spacing:.2px; color:var(--inkSecondary); }
.rule { width:58px; height:3px; margin:20px 0 16px; background:var(--accent); }
p { width:430px; font-size:21px; font-weight:400; line-height:1.45; }
.badge { position:absolute; right:0; top:0; width:80px; height:80px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%); }
.version { position:absolute; left:869px; top:27px; transform:translate(-50%,-50%) rotate(45deg); color:var(--badgeInk); font-size:26px; font-weight:700; line-height:1; }
.background-only .text { visibility:hidden; }
.background-only .version { visibility:hidden; }
</style>
<div class="scene"></div><div class="veil"></div>
<div class="text"><h1><span class="strong">Ebbbs</span> <span class="suffix">Renew</span></h1><div class="tag">(unofficial)</div><div class="rule"></div><p>Nine forms of goo, from ankle-high to towering. Nobody knows what an ebbb is.</p></div>
<div class="badge"></div><div class="version"></div>
<script>
window.ready = (async () => {
  const palette = await (await fetch('preview-palette.json')).json();
  for (const [key,value] of Object.entries(palette)) document.documentElement.style.setProperty('--'+key,value);
  document.documentElement.style.setProperty('--veil-rgb', palette.veil.match(/\w\w/g).map(v=>parseInt(v,16)).join(' '));
  const xml = new DOMParser().parseFromString(await (await fetch('../Mod/About/About.xml')).text(),'application/xml');
  const versions = [...xml.querySelectorAll('supportedVersions li')].map(e=>e.textContent.trim()).filter(v=>/^\d+(\.\d+)+$/.test(v));
  versions.sort((a,b)=> { const aa=a.split('.').map(Number), bb=b.split('.').map(Number); for(let i=0;i<Math.max(aa.length,bb.length);i++){ const d=(bb[i]||0)-(aa[i]||0); if(d)return d; } return 0; });
  document.querySelector('.version').textContent=versions[0];
  await document.fonts.ready;
  const img=new Image(); img.src='Preview.png'; await img.decode();
})();
</script></html>
