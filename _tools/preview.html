<!doctype html>
<meta charset="utf-8">
<title>Preview</title>
<style>
  /* The page IS the banner: 896 x 504, no margin, no scrollbar. Chrome headless
     screenshots it at exactly this size, so the text is composed at its final
     size and the glyphs are never resampled.

     Unlike the other mods, there is no Art/Preview-source.png behind this page.
     The nine creatures are flat black silhouettes, which is exactly what a
     browser draws well, so the scene is composed here from the mod's own
     textures rather than generated: every creature on the banner is the sprite
     the game actually draws. */
  html, body { margin: 0; padding: 0; background: #0b0a09; }
  body { width: 896px; height: 504px; overflow: hidden; }

  .frame {
    position: relative;
    width: 896px; height: 504px;
    overflow: hidden;
    background: #1b1712;
  }

  /* The back wall: a low band at the top edge, cold and desaturated, the way
     the game's fixed camera shows a wall - a strip of its front face and
     nothing more. */
  .wall {
    position: absolute; inset: 0 0 auto 0; height: 96px;
    background:
      linear-gradient(#2a2822 0%, #211f1a 62%, #14120e 100%);
  }
  .wall::after {                       /* board joints on the wall */
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg,
      rgba(0,0,0,.28) 0 2px, rgba(0,0,0,0) 2px 74px);
  }

  /* The floor: planks with a regular rhythm, reading as a grid without
     turning into a pattern. Warm umber, kept mid-dark so a black silhouette
     still reads on it away from the lamp. */
  .floor {
    position: absolute; inset: 96px 0 0 0;
    background:
      repeating-linear-gradient(0deg,
        rgba(0,0,0,.30) 0 2px, rgba(0,0,0,0) 2px 68px),
      repeating-linear-gradient(90deg,
        rgba(0,0,0,.16) 0 2px, rgba(0,0,0,0) 2px 116px),
      linear-gradient(#3b3026 0%, #33291f 55%, #2a2119 100%);
  }

  /* The lamp pool: one dominant warm source, a clear disc on the floor, a hard
     enough boundary to read. Everything the banner has to show stands in it. */
  .pool {
    position: absolute; left: 250px; top: 118px;
    width: 620px; height: 400px;
    background: radial-gradient(ellipse at 50% 45%,
      rgba(255, 205, 130, .92) 0%,
      rgba(247, 184, 104, .78) 34%,
      rgba(214, 143, 66, .36) 58%,
      rgba(120, 78, 34, .10) 78%,
      rgba(0,0,0,0) 100%);
    mix-blend-mode: screen;
  }
  /* A cold ambient over everything outside the pool. */
  .ambient {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 560px 360px at 62% 62%,
      rgba(10, 16, 26, 0) 0%,
      rgba(10, 16, 26, .35) 62%,
      rgba(8, 12, 20, .62) 100%);
  }

  /* Crates and shelves: boxy, functional, worn, seen from above enough that
     their lids read. Kept out of the lit centre so they never compete. */
  .crate {
    position: absolute;
    background: linear-gradient(#4a3a29, #3a2c1e);
    box-shadow: 0 8px 14px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.35);
    border-radius: 2px;
  }
  .crate::after {                      /* the lid, lighter, seen from above */
    content: ""; position: absolute; inset: 4px 4px auto 4px; height: 42%;
    background: linear-gradient(#5c4931, #4b3a26);
    border-radius: 1px;
  }

  .sprite { position: absolute; }
  .sprite img { display: block; width: 100%; height: auto; }

  /* Black on dark needs the floor around it to do the separating, so the
     contact shadow under a creature is small and tight, never a halo. */
  .lit img   { filter: drop-shadow(0 4px 6px rgba(0,0,0,.55)); }
  /* The two creatures that stay out of the lamp keep a faint warm rim, the
     only thing that stops a flat black shape from reading as a hole. */
  .dark img  { filter: drop-shadow(0 0 10px rgba(214,150,80,.30))
                       drop-shadow(0 3px 5px rgba(0,0,0,.5)); opacity: .95; }

  /* ---- The engraved text -------------------------------------------------
     Veil colour taken from the image itself: the ochre of the lamp pool,
     desaturated one step. Its WCAG luminance is 0.56, above 0.18, so the ink
     is the dark one and the drop shadows come off. The rule leaves amber for
     a dark brown, which amber would not survive on this ground. */
  .frame::after {
    content: ""; position: absolute; inset: 0; z-index: 2;
    background: radial-gradient(ellipse 900px 680px at top left,
      rgba(220, 194, 155, .94) 0%,
      rgba(220, 194, 155, .90) 45%,
      rgba(220, 194, 155, 0) 100%);
  }

  .text {
    position: absolute; z-index: 3;
    left: 50px; top: 58px;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #17120E;
  }
  h1 {
    margin: 0;
    font-size: 58px; font-weight: 600; line-height: 1.1;
    letter-spacing: .2px;
  }
  .rule {
    width: 58px; height: 3px;
    background: #8A5A18;
    margin: 22px 0 16px;
  }
  p {
    margin: 0; width: 430px;
    font-size: 21px; font-weight: 400; line-height: 1.45;
    color: #3A2E22;
  }
</style>

<div class="frame">

  <div class="crate" style="left: 702px; top: 300px; width: 104px; height: 86px;"></div>

  <div class="crate" style="left: 120px; top: 330px; width: 92px; height: 74px;"></div>

  </div>

  <div class="sprite lit" style="left: 604px; top: 40px; width: 176px;">

  </div>

  <!-- Three ebbbs, the smallest of the nine, together in the brightest part. -->

  <div class="sprite lit" style="left: 588px; top: 404px; width: 48px;">

  <div class="sprite lit" style="left: 634px; top: 380px; width: 54px;">

  </div>

    <img src="../Mod/Textures/Things/Pawn/Animal/Beee/Beee_south.png" alt="">
  </div>

  <div class="text">
    <h1>Ebbbs Renew</h1>
    <div class="rule"></div>
    <p>Nine forms of goo, from ankle-high to towering. Nobody knows what an ebbb is.</p>
  </div>
</div>
